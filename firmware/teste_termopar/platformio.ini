; ============================================================================
;  TESTE ISOLADO DO TERMOPAR - MAX31855 + termopar tipo K
;  Projeto SEPARADO do firmware principal, de proposito.
; ============================================================================
;  Isto NAO e o firmware do torrador: e um sketch descartavel que so le o
;  sensor e imprime no serial. Serve para provar que o modulo e a fiacao
;  estao corretos ANTES de encostar no firmware de verdade.
;
;  Rodar:
;      cd firmware/teste_termopar
;      pio run --target upload
;      pio device monitor
; ============================================================================

[env:ttgo-t-beam]
platform = espressif32
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/Adafruit MAX31855 library @ ^1.4.2
