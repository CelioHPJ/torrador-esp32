; ============================================================================
;  Torrador de Cafe - Firmware do modulo sensor (LilyGO T-Beam / ESP32)
;  CEFET-MG Varginha - Projeto de extensao
; ============================================================================
;  Board: ttgo-t-beam  -> definicao oficial do LilyGO T-Beam no PlatformIO.
;  Nesta fase usamos APENAS o Wi-Fi do ESP32. LoRa, GPS e AXP192 nao sao
;  inicializados (o Wi-Fi funciona sem tocar no gerenciador de energia).
; ============================================================================

; Sem -e, compila e grava so pelo USB. A gravacao pela rede e o env "ota",
; sempre pedido explicitamente (ver o fim do arquivo).
[platformio]
default_envs = ttgo-t-beam

[env:ttgo-t-beam]
platform = espressif32
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    ; Servidor HTTP + WebSocket assincrono (fork mantido em 2024/2025)
    ESP32Async/AsyncTCP @ ^3.4.0
    ESP32Async/ESPAsyncWebServer @ ^3.7.0
    ; Serializacao/parse do JSON trocado com o backend
    bblanchon/ArduinoJson @ ^7.2.0
    ; Termopar tipo K via MAX31855 (mesma versao do firmware/teste_termopar)
    adafruit/Adafruit MAX31855 library @ ^1.4.2

; ----------------------------------------------------------------------------
;  Gravacao PELA REDE, sem cabo. So funciona depois que a placa ja tem um
;  firmware com a rota /update (gravado uma vez pelo USB no env de cima):
;
;      pio run -e ota -t upload --upload-port <ip-da-placa>
;
;  A senha sai de OTA_SENHA em include/credenciais.h; nao repita aqui.
; ----------------------------------------------------------------------------
[env:ota]
extends = env:ttgo-t-beam
upload_protocol = custom
upload_command = $PYTHONEXE scripts/gravar_ota.py $SOURCE $UPLOAD_PORT
